[project]
name = "nexuslab"
version = "1.2.0"
description = "Self-hosted homelab dashboard: hub + per-machine agents"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I"]
ignore = [
  "E501",  # long lines are the LLM system prompt text
  "E731",  # small lambdas are used as local helpers
  "B904",  # HTTPException re-raises are intentional user-facing messages
  "S104",  # agents and hub bind 0.0.0.0 by design (LAN / Tailscale only)
  "S603", "S607",  # fixed argv lists for ethtool / systemctl, no shell
  "S310",  # Ollama URL scheme is validated at startup (see agent.py)
  "S110",  # best-effort probes deliberately swallow errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["nexuslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["agent", "hub"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
